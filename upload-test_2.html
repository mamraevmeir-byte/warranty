<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{background:#111;color:#fff;font-family:sans-serif;padding:20px;}
.upload-area{background:#1e2235;border:1.5px dashed rgba(255,255,255,0.3);border-radius:12px;padding:20px;text-align:center;margin-bottom:10px;position:relative;min-height:80px;}
.upload-area input[type=file]{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer;z-index:99;-webkit-appearance:none;}
.upload-area .lbl{pointer-events:none;}
</style>
</head>
<body>
<h2>Upload Test v3</h2>
<div class="upload-area">
  <div class="lbl" id="lbl0">📄 חשבונית - לחץ לבחירה</div>
  <input type="file" accept="image/*,application/pdf" onchange="handleFile(this,0)">
</div>
<div class="upload-area">
  <div class="lbl" id="lbl1">🛡️ תעודת אחריות - לחץ לבחירה</div>
  <input type="file" accept="image/*,application/pdf" onchange="handleFile(this,1)">
</div>
<div id="status" style="margin-top:10px;font-size:14px">לא נבחר קובץ</div>
<script>
function handleFile(input, idx) {
  var file = input.files[0];
  if (!file) return;
  document.getElementById('status').textContent = 'נבחר: ' + file.name + ' (' + Math.round(file.size/1024) + 'KB)';
  document.getElementById('lbl'+idx).textContent = '✅ ' + file.name;
}
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{background:#111;color:#fff;font-family:sans-serif;padding:20px;}
.upload-area{background:#1e2235;border:1.5px dashed rgba(255,255,255,0.3);border-radius:12px;overflow:hidden;margin-bottom:10px;}
.upload-area label{display:block;padding:20px;text-align:center;cursor:pointer;-webkit-user-select:none;}
.upload-area input[type=file]{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;}
</style>
</head>
<body>
<h2>Upload Test (Safari Fix)</h2>
<div class="upload-area">
  <label for="f0">
    <div id="lbl0">📄 חשבונית רכישה</div>
  </label>
  <input type="file" id="f0" accept="image/*,application/pdf" onchange="handleFile(this,0)">
</div>
<div class="upload-area">
  <label for="f1">
    <div id="lbl1">🛡️ תעודת אחריות</div>
  </label>
  <input type="file" id="f1" accept="image/*,application/pdf" onchange="handleFile(this,1)">
</div>
<div id="status" style="margin-top:10px">לא נבחר קובץ</div>
<script>
function handleFile(input, idx) {
  var file = input.files[0];
  if (!file) return;
  document.getElementById('status').textContent = 'נבחר: ' + file.name + ' (' + Math.round(file.size/1024) + 'KB)';
  document.getElementById('lbl'+idx).textContent = '✅ ' + file.name;
}
</script>
</body>
</html>
